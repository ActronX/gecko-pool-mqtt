name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        # Integration tests skip themselves without a broker.
        run: python -m pytest -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Start test broker
        run: docker compose -f docker-compose.test.yml up -d mqtt-test
      - name: Run pytest against running broker
        run: python -m pytest -v
        env:
          MQTT_TEST_HOST: 127.0.0.1
          MQTT_TEST_PORT: "1883"
      - name: Stop test broker
        if: always()
        run: docker compose -f docker-compose.test.yml down
